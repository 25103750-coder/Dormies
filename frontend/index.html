<!doctype html>
<html lang="en">
  <head>
    <!--
      FILE: frontend/index.html
      PART OF: Front end > start
      WHAT IT DOES: The single HTML page. The small script in the head applies the saved night mode before
                    the page is drawn, so there is no white flash.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dormies | Dormitory Management System</title>
    <script>
      // apply the saved theme before the page is drawn, so there is no white flash in night mode
      try { document.documentElement.setAttribute('data-theme', (sessionStorage.getItem('dormies-tab-theme') || localStorage.getItem('dormies-theme')) === 'dark' ? 'dark' : 'light') } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
